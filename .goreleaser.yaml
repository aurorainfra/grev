# GoReleaser v2 — release builds for the grev tools.
#   goreleaser check
#   goreleaser release --snapshot --clean --skip=publish,sign,sbom   # local dry run
# Tagged releases run from .github/workflows/release.yml.
version: 2

project_name: grev

before:
  hooks:
    # Man pages and completions are generated by the (host) binaries.
    - make man completions VERSION={{ .Version }}

# One build per tool; everything else is shared through the anchor.
builds:
  - &build
    id: grev
    main: ./cmd/grev
    binary: grev
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/aurorainfra/grev/internal/cli.Version={{ .Version }}
    goos: [linux, darwin, freebsd, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
  - { <<: *build, id: isv, main: ./cmd/isv, binary: isv }
  - { <<: *build, id: oneof, main: ./cmd/oneof, binary: oneof }
  - { <<: *build, id: tagv, main: ./cmd/tagv, binary: tagv }
  - { <<: *build, id: rank, main: ./cmd/rank, binary: rank }
  - { <<: *build, id: pickv, main: ./cmd/pickv, binary: pickv }
  - { <<: *build, id: uniqv, main: ./cmd/uniqv, binary: uniqv }
  - { <<: *build, id: unwrap, main: ./cmd/unwrap, binary: unwrap }
  - { <<: *build, id: seg, main: ./cmd/seg, binary: seg }
  - { <<: *build, id: cutv, main: ./cmd/cutv, binary: cutv }
  - { <<: *build, id: seek, main: ./cmd/seek, binary: seek }
  - { <<: *build, id: probev, main: ./cmd/probev, binary: probev }
  - { <<: *build, id: jev, main: ./cmd/jev, binary: jev }

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE-MIT
      - LICENSE-APACHE
      - man/*
      - completions/**/*

nfpms:
  - id: packages
    package_name: grev
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Aurora Infrastructure EU
    maintainer: Aurora Infrastructure EU <oss@aurorainfra.eu>
    homepage: https://github.com/aurorainfra/grev
    description: |-
      Unix filters that ask questions instead of matching patterns.
      grev is grep where the pattern is a question, plus isv, oneof, tagv,
      rank, pickv, uniqv, unwrap, seg, cutv, seek and probev, built on
      TypeSafe's Jev System One models.
    license: MIT OR Apache-2.0
    section: utils
    priority: optional
    formats: [deb, rpm, apk, archlinux]
    bindir: /usr/bin
    contents:
      - src: ./man/*.1.gz
        dst: /usr/share/man/man1/
        file_info: { mode: 0644 }
      - src: ./man/*.5.gz
        dst: /usr/share/man/man5/
        file_info: { mode: 0644 }
      - src: ./man/*.7.gz
        dst: /usr/share/man/man7/
        file_info: { mode: 0644 }
      - src: ./completions/bash/*
        dst: /usr/share/bash-completion/completions/
        file_info: { mode: 0644 }
      - src: ./completions/zsh/*
        dst: /usr/share/zsh/site-functions/
        file_info: { mode: 0644 }
      - src: ./completions/fish/*
        dst: /usr/share/fish/vendor_completions.d/
        file_info: { mode: 0644 }
      - src: ./LICENSE-MIT
        dst: /usr/share/licenses/grev/LICENSE-MIT
        file_info: { mode: 0644 }
      - src: ./LICENSE-APACHE
        dst: /usr/share/licenses/grev/LICENSE-APACHE
        file_info: { mode: 0644 }
      # Debian policy: licences live in /usr/share/doc/<package>.
      - src: ./LICENSE-MIT
        dst: /usr/share/doc/grev/LICENSE-MIT
        file_info: { mode: 0644 }
        packager: deb
      - src: ./LICENSE-APACHE
        dst: /usr/share/doc/grev/LICENSE-APACHE
        file_info: { mode: 0644 }
        packager: deb
      - src: ./README.md
        dst: /usr/share/doc/grev/README.md
        file_info: { mode: 0644 }
    archlinux:
      packager: Aurora Infrastructure EU <oss@aurorainfra.eu>

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  # Keyless (Sigstore) signature of the checksum file; verify with
  # cosign verify-blob --certificate checksums.txt.pem --signature checksums.txt.sig \
  #   --certificate-identity-regexp 'https://github.com/aurorainfra/grev/' \
  #   --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - --yes

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^test:"
      - "^ci:"
      - "^docs:"
      - "^chore:"

release:
  github:
    owner: aurorainfra
    name: grev
  prerelease: auto
  footer: |
    Checksums are signed with Sigstore (cosign, keyless); see the signs section of `.goreleaser.yaml` to verify.
